<!DOCTYPE html>
<html>
<head>
   <meta name="viewport" content="width=device-width, initial-scale=0.5, maximum-scale=0.5, user-scalable=no">
   <link rel="stylesheet" href="styles.css">
   <link rel="icon" type="image/x-icon" href="favicon.png">
</head>
<body>

  <div class='buttons'>
     <div class='grid-item' id='mute' data-target='tv'><img src='mute.svg' /></div>  
     <input id="volume-slider" type="range" min="0" max="100" value="0" />
     <div class='grid-item' id='power' data-target='none'><img src='power.svg' /></div>

     <div class='grid-item' data-target='actualsource' data-kodikey='escape'><img id='home' src='home.svg' /></div>
     <div class='grid-item'></div>
     <div class='grid-item' id='up' data-target='actualsource'><img src='up.svg' /></div>
     <div class='grid-item'></div>
     <div class='grid-item' id='menu' data-target='actualsource'><img src='menu.svg' /></div>  

     <div class='grid-item'></div>
     <div class='grid-item' id='left' data-target='actualsource'><img src='left.svg' /></div>
     <div class='grid-item' id='enter' data-target='actualsource'><img src='enter.svg' /></div>
     <div class='grid-item' id='right' data-target='actualsource'><img src='right.svg' /></div>  
     <div class='grid-item'></div>

     <div class='grid-item' id='back' data-target='actualsource' data-kodikey='backspace'><img src='back.svg' /></div>
     <div class='grid-item'><div id='stop'  data-target='kodi' data-kodikey='x'><img src='stop.svg' /></div></div>
     <div class='grid-item' id='down' data-target='actualsource'><img src='down.svg' /></div>
     <div class='grid-item'><div id='play' data-target='kodi' data-kodikey='space'><img src='play.svg' /></div><div id='pause' data-target='kodi' data-kodikey='space'><img src='pause.svg' /></div></div>
     <div class='grid-item'></div>
  </div>

  <div class='channels' id='channels'>
     <div class='channel' id='kodi'>
        <span class='connection-status' id='kodi-status'></span>
        <img class='channel-icon' src='https://upload.wikimedia.org/wikipedia/commons/thumb/2/25/Kodi-logo-Thumbnail-light-transparent.png/600px-Kodi-logo-Thumbnail-light-transparent.png' alt='Kodi' />
        <div class='epg'>
           <div class='epg-title'>&nbsp;</div>
           <div class='epg-desc'>&nbsp;</div>
        </div>
     </div>
  </div>
  
  <dialog id='kodi-textinput'>
     <div>Eingabe f&uuml;r Kodi</div>
     <input type="text" id="kodi-input" name="kodi-input"><br/>
     <button type="button" id="kodi-input-send">Senden</button>
  </dialog>
  
  <dialog id='epgdetail'>
     <div></div>
     <button id='nextEpg'>&gt;</button>
     <button id='prevEpg'>&lt;</button>
  </dialog>

  <script src='wsproxy.js'></script>
  <script src='client.js'></script>
  <script src='tv.js'></script>
  <script src='tvh.js'></script>
  <script src='kodi.js'></script>
  <script src='holdrepeat.js'></script>
  <script src='app.js'></script>
</body>

</html>
